<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyph: Mortal Odds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Lilita+One&display=swap" rel="stylesheet">
<style>
/* =====================================
   ⬢  Tokens
   ===================================== */
:root {
  --bg: #E8EAF5;
  --star: rgba(40, 48, 110, .18);
  --panel: #FFFFFF;
  --panel-2: #F1F2FA;
  --line: #CDD2E6;
  --text: #151833;
  --muted: #5A6284;
  --accent: #5B4CE6;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(91, 76, 230, .12);
  --gold: #B7791F;
  --win: #15803D;
  --loss: #B91C1C;
  --heart: #E5484D;
  --heart-off: #C6CAD9;
  --cta-bg: #151833;
  --cta-ink: #FFFFFF;
  --dock: #DDEFE5;
  --dock-line: #9CC7AE;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --fun: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #070B1A; --star: rgba(190, 200, 255, .5); --panel: #141C33; --panel-2: #0D1328;
    --line: #2A3556; --text: #E8EAF6; --muted: #9AA3C2; --accent: #6D5DF6; --accent-soft: rgba(109, 93, 246, .18);
    --gold: #F5B83D; --win: #4ADE80; --loss: #F87171; --heart-off: #2B3350;
    --cta-bg: #FFFFFF; --cta-ink: #0D1328; --dock: #13291F; --dock-line: #C9D98A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #070B1A; --star: rgba(190, 200, 255, .5); --panel: #141C33; --panel-2: #0D1328;
  --line: #2A3556; --text: #E8EAF6; --muted: #9AA3C2; --accent: #6D5DF6; --accent-soft: rgba(109, 93, 246, .18);
  --gold: #F5B83D; --win: #4ADE80; --loss: #F87171; --heart-off: #2B3350;
  --cta-bg: #FFFFFF; --cta-ink: #0D1328; --dock: #13291F; --dock-line: #C9D98A;
  color-scheme: dark;
}

/* =====================================
   ⬢  Base
   ===================================== */
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; color: var(--text); font-family: var(--mono); font-size: 15px; line-height: 1.55;
  font-variant-numeric: tabular-nums;
  background:
    radial-gradient(1px 1px at 12% 18%, var(--star) 50%, transparent 51%),
    radial-gradient(1px 1px at 38% 72%, var(--star) 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 64% 30%, var(--star) 50%, transparent 51%),
    radial-gradient(1px 1px at 82% 58%, var(--star) 50%, transparent 51%),
    radial-gradient(1px 1px at 52% 90%, var(--star) 50%, transparent 51%),
    var(--bg);
  background-size: 420px 420px, 380px 380px, 520px 520px, 460px 460px, 340px 340px, auto;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: .4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2, h3 { margin: 0; font-weight: 800; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }

/* =====================================
   ⬢  Top bar
   ===================================== */
.topbar {
  display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 16px;
  width: 100%; max-width: 1440px; margin: 0 auto; padding: 18px 24px;
}
.logo {
  font-family: var(--fun); font-size: 2.3rem; line-height: 1; letter-spacing: .02em;
  color: #FFC53D; text-shadow: 0 3px 0 #C2410C, 0 5px 12px rgba(0,0,0,.35);
}
.logo small { font-size: .9rem; vertical-align: top; }
.account { display: flex; justify-content: flex-end; align-items: center; gap: 12px; }
.wallet {
  display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px;
  padding: 7px 16px; background: var(--panel-2); white-space: nowrap;
}
.coin {
  display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #FFE08A, #F5A524 70%); color: #7A4A00; font-weight: 800; font-size: 12px;
}
.avatar-menu { position: relative; }
.avatar-menu summary {
  list-style: none; display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
  border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px 4px 4px; background: var(--panel-2);
}
.avatar-menu summary::-webkit-details-marker { display: none; }
.avatar { width: 34px; height: 34px; border-radius: 50%; background: radial-gradient(circle at 50% 40%, #7BD66B, #2F8A3C); }
.menu {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 160px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px;
}
.menu button { width: 100%; text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; }
.menu button:hover { background: var(--accent-soft); }

/* =====================================
   ⬢  Layout
   ===================================== */
.app {
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start;
  width: 100%; max-width: 1440px; margin: 0 auto; padding: 0 24px 24px;
}
.col { display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
.card h2 { font-size: 1.05rem; }
/* Desktop: the page is locked to the viewport; nothing in the stage scrolls */
@media (min-width: 1081px) and (min-height: 640px) {
  body { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .app { flex: 1; min-height: 0; align-items: stretch; }
  .stage { min-height: 0; }
  .right { min-height: 0; overflow-y: auto; padding-bottom: 110px; }
}
@media (max-width: 1080px) {
  .app { grid-template-columns: 1fr; }
  .stage { min-height: 80vh; }
}

/* =====================================
   ⬢  Stage (game area)
   ===================================== */
.stage {
  display: flex; flex-direction: column; gap: 14px;
  border: 1px dashed var(--line); border-radius: 18px; padding: 18px 22px 100px;
}
.stage-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.eras { display: inline-flex; gap: 4px; padding: 4px; border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); }
.eras button { background: none; border: 0; border-radius: 7px; padding: 5px 11px; color: var(--muted); font-size: .85rem; }
.eras button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.status-chip {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 999px;
  background: var(--panel-2); border: 1px solid var(--line); font-size: .85rem; color: var(--muted);
}
.status-chip b { color: var(--text); }
/* Hero: large when idle, compact once betting starts */
.draw { flex: none; text-align: center; padding-top: 10px; }
.year {
  font-family: var(--fun); font-size: clamp(3.4rem, 9vw, 6rem); line-height: 1; color: var(--gold);
  text-shadow: 0 4px 0 rgba(0,0,0,.25); min-height: 1em; margin: 0; transition: font-size .25s ease;
}
.year.rolling { opacity: .55; }
.where { margin: 8px 0 0; font-size: 1.05rem; }
.where b { font-weight: 800; }
.where-sub { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
.draw.compact .where-sub { display: inline; font-size: .8rem; margin-left: 6px; }
.draw.compact .where-sub + .where-sub { display: block; margin: 2px 0 0; }
.timeline { display: block; width: 100%; max-width: 640px; height: auto; margin: 16px auto 6px; }
.timeline .axis, .timeline .tick { stroke: var(--line); }
.timeline text { fill: var(--muted); font: 11px var(--mono); }
.timeline .marker { fill: var(--accent); transition: transform .5s ease; }
.hint { color: var(--muted); max-width: 58ch; margin: 8px auto 18px; }
.actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.draw.compact { padding-top: 0; }
.draw.compact .year { font-size: clamp(2.4rem, 4.5vw, 3.4rem); }
.draw.compact .where { margin-top: 4px; font-size: .95rem; }
.draw.compact .timeline { max-width: 520px; margin: 8px auto 0; }
.stage.revealing .draw { display: none; }
@media (max-height: 800px) { .draw.compact .timeline { display: none; } }
.btn { border-radius: 10px; padding: 11px 20px; font-weight: 800; border: 1px solid var(--line); background: var(--panel); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* Pane: one market or one reveal page at a time, fills the remaining height */
.pane { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.board, .reveal { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
.market {
  flex: 1; min-height: 0; overflow: auto; display: flex; flex-direction: column; justify-content: center; gap: 18px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 22px 26px;
}
.market-step { color: var(--muted); font-size: .8rem; margin: 0 0 4px; }
.market h3 { font-size: 1.35rem; }
.note { color: var(--muted); font-size: .85rem; margin: 4px 0 0; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
.opt {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left;
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 12px; padding: 14px 16px; font-size: 1.02rem;
}
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.odds { font-weight: 800; color: var(--gold); }
.opt[aria-pressed="true"] .odds { color: var(--accent-ink); }
.opt-label { font-weight: 600; }
.opt-pay { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; text-align: right; }
.tag { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.opt[aria-pressed="true"] .tag { color: var(--accent-ink); opacity: .8; }
.dy { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.dy-year { font-family: var(--fun); font-size: 2.4rem; color: var(--gold); }
.dy-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: .78rem; margin-top: -10px; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

.pager { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.dots { display: flex; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.dot.bet { background: var(--accent); }
.dot.current { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text); }

.reveal-page {
  flex: 1; min-height: 0; overflow: auto; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; padding: 20px 24px; animation: rise .35s ease;
}
.fate { font-family: var(--fun); font-weight: 400; font-size: clamp(1.6rem, 3.2vw, 2.2rem); line-height: 1.1; margin: 0 0 10px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 16px; margin: 0 0 14px; }
.facts dt { color: var(--muted); font-size: .8rem; }
.facts dd { margin: 0; font-weight: 800; }
.story { max-width: 64ch; margin: 0; font-size: 1.02rem; }
.results-wrap { overflow-x: auto; }
.results { width: 100%; min-width: 540px; border-collapse: collapse; font-size: .88rem; }
.results th { text-align: left; color: var(--muted); font-weight: 400; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.results td { padding: 6px 8px; border-bottom: 1px solid var(--line); }
.results .num { text-align: right; }
.pos { color: var(--win); font-weight: 800; }
.neg { color: var(--loss); font-weight: 800; }
.edge-note { color: var(--muted); font-size: .82rem; max-width: 64ch; margin: 12px 0 0; }
.net { font-size: 1.3rem; margin: 12px 0 0; }
/* Reveal reel: the life plays out, bets settle as it runs */
.reel { display: flex; flex-direction: column; gap: 14px; }
.reel-top { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.reel-label { display: block; color: var(--muted); font-size: .78rem; }
.reel-top strong { font-family: var(--fun); font-weight: 400; font-size: clamp(1.6rem, 3vw, 2.2rem); color: var(--gold); }
.lifespan { display: block; width: 100%; height: auto; }
.lifespan .axis { stroke: var(--line); stroke-width: 4; stroke-linecap: round; }
.lifespan .run { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.lifespan .tick { stroke: var(--line); }
.lifespan text { fill: var(--muted); font: 11px var(--mono); }
.lifespan .x { stroke: var(--loss); stroke-width: 3.5; stroke-linecap: round; }
.lifespan .x-age { fill: var(--win); font: 800 15px var(--mono); }
.lifespan .real { fill: var(--accent); opacity: .5; }
.lifespan .bookie { fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 4 3; }
.reel-bets { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 8px; }
.reel-row {
  display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px;
  border-radius: 10px; background: var(--panel-2); border: 1px solid var(--line); transition: border-color .2s, opacity .2s;
}
.reel-row:has([data-state="won"]) { border-color: var(--win); }
.reel-row:has([data-state="lost"]) { opacity: .6; }
.verdict { font-weight: 800; color: var(--muted); white-space: nowrap; }
.verdict[data-state="live"] { color: var(--gold); animation: pulse .8s ease-in-out infinite; }
.verdict[data-state="won"] { color: var(--win); animation: pop .3s ease; }
.verdict[data-state="lost"] { color: var(--loss); animation: pop .3s ease; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; color: var(--muted); font-size: .78rem; margin: 14px 0 4px; }
.legend i { display: inline-block; width: 14px; height: 8px; margin-right: 6px; vertical-align: middle; }
.legend .l-real { background: var(--accent); opacity: .5; }
.legend .l-bookie { border-top: 2px dashed var(--gold); height: 0; }
@keyframes pulse { 50% { opacity: .35; } }
@keyframes pop { from { transform: scale(1.35); } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* =====================================
   ⬢  Right column
   ===================================== */
.stake-total {
  display: flex; align-items: baseline; gap: 10px; margin: 14px 0 12px; padding: 14px 16px;
  background: var(--panel-2); border-radius: 12px;
}
.stake-total strong { font-size: 1.9rem; }
.chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.chips button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 8px 0; font-weight: 600; }
.chips button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chips-label { color: var(--muted); font-size: .78rem; margin: 12px 0 6px; }
.slip-list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; max-height: 30vh; overflow-y: auto; }
.slip-empty { color: var(--muted); font-size: .85rem; margin: 14px 0 0; }
.slip-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px; border-radius: 10px; background: var(--panel-2); }
.slip-market { display: block; color: var(--muted); font-size: .75rem; }
.slip-pick { font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); }
.stepper output { min-width: 3ch; text-align: center; font-weight: 800; }
.potential { display: flex; justify-content: space-between; align-items: center; margin: 16px 0; }
.potential strong { display: block; font-size: 1.1rem; }
.pill { border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600; }
.cta { width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--cta-bg); color: var(--cta-ink); font-weight: 800; font-size: 1rem; }
.lb-head { display: flex; justify-content: space-between; align-items: baseline; }
.leaders { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.leaders li { display: flex; align-items: center; gap: 12px; }
.rank { display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--panel-2); font-weight: 800; flex: none; }
.leaders .who { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.leaders .you .who { color: var(--accent); font-weight: 800; }

/* =====================================
   ⬢  Dock (bottom nav)
   ===================================== */
.dock {
  position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 10px; padding: 10px 18px; border-radius: 22px;
  background: var(--dock); border: 1.5px solid var(--dock-line); box-shadow: 0 10px 30px rgba(0,0,0,.35);
}
.dock button { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; }
.dock-icon {
  display: grid; place-items: center; width: 48px; height: 48px; border-radius: 50%;
  border: 3px solid var(--line); background: var(--panel-2); color: var(--muted);
}
.dock-icon svg { width: 22px; height: 22px; fill: currentColor; }
.dock-label { font-size: .78rem; padding: 1px 9px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); }
.dock [aria-current="page"] .dock-icon { border-color: #5EEAD4; background: #F5A524; color: #7A4A00; }
.dock [aria-current="page"] .dock-label { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

@media (prefers-reduced-motion: reduce) {
  .reveal-page { animation: none; }
  .year { transition: none; }
  .verdict[data-state] { animation: none; }
  .timeline .marker { transition: none; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="logo" aria-label="Lyph"><small>✦</small>LYPH<small>✦</small></div>
  <div class="account">
    <div class="wallet"><span class="coin" aria-hidden="true">$</span><strong id="bankroll">1,000</strong><span class="muted" id="walletUnit">chips</span></div>
    <details class="avatar-menu">
      <summary aria-label="Account menu"><span class="avatar"></span><span aria-hidden="true">▾</span></summary>
      <div class="menu"><button type="button" id="resetBtn">Start over</button></div>
    </details>
  </div>
</header>

<div class="app">

  <!-- ⬢ Center: game area -->
  <main class="stage" id="stage" aria-live="polite">
    <div class="stage-bar">
      <div class="eras" id="eras" role="group" aria-label="Which humans can be drawn">
        <button type="button" data-era="all">All of history</button>
        <button type="button" data-era="ce">Since year 1</button>
        <button type="button" data-era="modern">Since 1750</button>
      </div>
      <div class="status" id="status"></div>
    </div>
    <div class="draw" id="drawHero">
      <p class="year" id="year">?</p>
      <p class="where" id="where">Nobody drawn yet.</p>
      <svg class="timeline" id="timeline" viewBox="0 0 600 44" role="img" aria-label="Where the birth year sits in human history"></svg>
      <p class="hint" id="hint"></p>
      <div class="actions">
        <button class="btn btn-accent" id="drawBtn" type="button">Draw a human</button>
      </div>
    </div>
    <div class="pane">
      <section class="board" id="board" hidden></section>
      <section class="reveal" id="reveal" hidden></section>
    </div>
  </main>

  <!-- ⬢ Right: bet slip, leaderboard -->
  <aside class="col right">
    <section class="card">
      <h2>Your bet</h2>
      <div class="stake-total"><span class="coin" aria-hidden="true">$</span><strong id="staked">0</strong><span class="muted" id="stakeUnit">chips</span></div>
      <p class="chips-label">Chip size</p>
      <div class="chips" id="chips" role="group" aria-label="Chip size"></div>
      <div id="slipList"></div>
      <div class="potential">
        <div><span class="muted">✨ Potential win</span><strong id="potential">0</strong></div>
        <span class="pill" id="betCount">0 bets</span>
      </div>
      <button class="cta" id="lockBtn" type="button" disabled>Place bet</button>
    </section>
    <section class="card">
      <div class="lb-head"><h2>Leaderboard</h2><span class="muted">Skill score</span></div>
      <ol class="leaders" id="leaders"></ol>
    </section>
  </aside>
</div>

<nav class="dock" aria-label="Main">
  <button type="button" aria-disabled="true"><span class="dock-icon"><svg viewBox="0 0 24 24"><path d="M4 20V12h4v8zm6 0V8h4v12zm6 0V4h4v16z"/></svg></span><span class="dock-label">stats</span></button>

<script>
/* Lyph: Mortal Odds. Draw a random human from all of history and bet on
   their fate. One demographic model drives both the bookie and the outcome:
   the bookie sees only the birth year, the outcome also uses region, sex and
   historical catastrophes. The leaderboard ranks skill: the expected value
   of each bet at the real odds, so luck does not count. All figures are
   rough estimates tuned for play. Currency is play chips until wagering is cleared. */

// =====================================
// ⬢  Constants
// =====================================
const CURRENT_YEAR = new Date().getFullYear();
const CURRENCY = 'chips';
const HOUSE_EDGE = 0.08;
const SIMS = 5000;
const MAX_ODDS = 60;
const MIN_P = 0.003;
const START_BANKROLL = 1000;
const CHIP_SIZES = [1, 5, 10, 25, 50];
const MIN_STAKE = CHIP_SIZES[0];
const SKIP_FEE = 5;
const DEATH_WINDOW = 5;
const REEL_MAX_MS = 3200;
const STORAGE_KEY = 'lyph-mortal-odds:v1';

// Placeholder leaderboard (skill points) until the backend serves real scores.
const MOCK_LEADERS = [
  { name: 'ceeriil', pts: 1850 },
  { name: 'devdanhiel', pts: 1520 },
  { name: 'SUNFLOWER', pts: 1280 },
  { name: 'ICE_CREAM99', pts: 910 },
];

// Age brackets for the age market, used by the reveal animation.
const AGE_RANGES = { u5: [0, 5], y: [5, 30], m: [30, 60], o: [60, Infinity] };

const BASE_HINT = 'Draw a random human from all of history. The bookie prices every bet on the birth year alone. You also know where they were born, and you know your history.';

const REGIONS = {
  ssa: 'Sub-Saharan Africa',
  mena: 'North Africa and the Middle East',
  eur: 'Europe',
  sas: 'South Asia',
  eas: 'East Asia',
  sea: 'Southeast Asia and Oceania',
  ame: 'the Americas',
};

const MODES = { all: -Infinity, ce: 1, modern: 1750 };

// Births in billions per era (PRB estimates) and rough regional shares.
const ERAS = [
  { from: -50000, to: -8000, births: 1.14, skew: 1.2, shares: { ssa: 40, mena: 15, eur: 10, sas: 10, eas: 10, sea: 10, ame: 5 } },
  { from: -8000, to: 1, births: 46.0, skew: 3, shares: { ssa: 12, mena: 15, eur: 13, sas: 25, eas: 22, sea: 7, ame: 6 } },
  { from: 1, to: 1200, births: 26.6, skew: 1.3, shares: { ssa: 10, mena: 10, eur: 13, sas: 28, eas: 28, sea: 6, ame: 5 } },
  { from: 1200, to: 1650, births: 12.8, skew: 1.2, shares: { ssa: 10, mena: 7, eur: 18, sas: 25, eas: 28, sea: 6, ame: 6 } },
  { from: 1650, to: 1750, births: 3.17, skew: 1.1, shares: { ssa: 9, mena: 5, eur: 20, sas: 22, eas: 35, sea: 5, ame: 4 } },
  { from: 1750, to: 1850, births: 4.05, skew: 1.2, shares: { ssa: 9, mena: 5, eur: 20, sas: 22, eas: 35, sea: 5, ame: 4 } },
  { from: 1850, to: 1900, births: 2.90, skew: 1.1, shares: { ssa: 8, mena: 4, eur: 22, sas: 20, eas: 28, sea: 7, ame: 11 } },
  { from: 1900, to: 1950, births: 3.39, skew: 1.1, shares: { ssa: 9, mena: 5, eur: 18, sas: 21, eas: 26, sea: 8, ame: 13 } },
  { from: 1950, to: 1995, births: 5.43, skew: 1.1, shares: { ssa: 13, mena: 7, eur: 10, sas: 25, eas: 23, sea: 10, ame: 12 } },
  { from: 1995, to: CURRENT_YEAR, births: 4.2, skew: 1, shares: { ssa: 20, mena: 7, eur: 6, sas: 27, eas: 16, sea: 11, ame: 11 } },
];

// Global curves by year: [year, value]
const Q5 = [[-50000, .45], [-8000, .44], [0, .42], [1200, .42], [1800, .40], [1900, .36], [1950, .22], [1970, .15], [1990, .09], [2010, .05], [2030, .037]];
const ADULT_MEAN = [[-50000, 36], [-8000, 38], [0, 40], [1200, 42], [1800, 45], [1900, 50], [1950, 58], [1970, 63], [1990, 67], [2010, 71], [2030, 74]];
const ADULT_SD = [[-50000, 17], [1900, 17], [1970, 15], [2030, 14]];
const LITERACY = [[-50000, 0], [-3200, 0], [-1000, .01], [0, .03], [1000, .04], [1500, .06], [1700, .09], [1820, .12], [1900, .21], [1950, .40], [1970, .60], [2000, .80], [2030, .88]];
const URBAN = [[-50000, 0], [-3000, .01], [0, .04], [1500, .05], [1800, .07], [1900, .16], [1950, .29], [2000, .47], [2030, .58]];

// Region modifiers: [child-mortality multiplier, adult lifespan shift]
const REGION_MODS = {
  industrial: { eur: [.85, 4], ame: [.9, 3], eas: [1, 0], sas: [1.1, -3], ssa: [1.15, -4], mena: [1.05, -1], sea: [1.05, -1] },
  modern: { eur: [.25, 8], ame: [.5, 4], eas: [.5, 4], sas: [1.3, -3], ssa: [2.2, -10], mena: [.9, 0], sea: [.9, 0] },
};
const LIT_MULT = {
  ancient: { ssa: .3, mena: 1.3, eur: .8, sas: .9, eas: 1.3, sea: .7, ame: .3 },
  early: { ssa: .2, mena: .6, eur: 3, sas: .4, eas: 1.2, sea: .7, ame: 2 },
  modern: { ssa: .65, mena: .85, eur: 1.25, sas: .75, eas: 1.1, sea: 1.05, ame: 1.15 },
};
const SEX_LIT = { old: { girl: .55, boy: 1.45 }, new: { girl: .92, boy: 1.08 } };
const CITY_MULT = {
  old: { ssa: .5, mena: 1.5, eur: .8, sas: 1, eas: 1.3, sea: .8, ame: .8 },
  new: { ssa: .7, mena: 1.2, eur: 1.4, sas: .65, eas: 1, sea: .9, ame: 1.45 },
};
const SEX_Q5 = { girl: .92, boy: 1.08, any: 1 };

// Catastrophes the bookie ignores. p = death chance if alive for the whole window.
const SHOCKS = [
  { label: 'Plague of Justinian', phrase: 'Plague of Justinian', from: 541, to: 549, p: { eur: .2, mena: .2 } },
  { label: 'Mongol conquests', phrase: 'Mongol conquests', from: 1206, to: 1260, p: { eas: .08, mena: .08 } },
  { label: 'Black Death', phrase: 'Black Death', from: 1346, to: 1353, p: { eur: .4, mena: .3 } },
  { label: 'Post-contact epidemics', phrase: 'epidemics that followed European contact', from: 1519, to: 1650, p: { ame: .6 } },
  { label: 'Taiping Rebellion', phrase: 'Taiping Rebellion', from: 1850, to: 1864, p: { eas: .06 } },
  { label: 'First World War', phrase: 'First World War', from: 1914, to: 1918, p: { eur: .05 }, sex: { boy: 2.4, girl: .3 }, ages: [16, 50] },
  { label: '1918 influenza', phrase: '1918 influenza pandemic', from: 1918, to: 1920, p: { all: .025, sas: .05 } },
  { label: 'Second World War', phrase: 'Second World War', from: 1939, to: 1945, p: { eur: .06, eas: .04, sea: .03 }, sex: { boy: 1.5, girl: .6 } },
  { label: 'Great Chinese Famine', phrase: 'Great Chinese Famine', from: 1959, to: 1961, p: { eas: .04 } },
  { label: 'HIV/AIDS', phrase: 'HIV/AIDS epidemic', from: 1990, to: 2010, p: { ssa: .05 }, ages: [15, 49] },
  { label: 'COVID-19', phrase: 'COVID-19 pandemic', from: 2020, to: 2022, p: { all: .01 }, ages: [65, 120] },
];

// Bet markets. Swap or add entries without touching the engine.
const MARKETS = [
  {
    id: 'sex', title: 'Girl or boy',
    note: 'Close to a coin flip. A hedge, not an edge.',
    fixed: { girl: .5, boy: .5 },
    options: [{ id: 'girl', label: 'Girl' }, { id: 'boy', label: 'Boy' }],
    resolve: l => l.sex,
  },
  {
    id: 'age', title: 'Age at death',
    options: [{ id: 'u5', label: 'Under 5' }, { id: 'y', label: '5 to 29' }, { id: 'm', label: '30 to 59' }, { id: 'o', label: '60 or older' }],
    resolve: l => l.age < 5 ? 'u5' : l.age < 30 ? 'y' : l.age < 60 ? 'm' : 'o',
  },
  {
    id: 'read', title: 'Learns to read',
    options: [{ id: 'yes', label: 'Yes' }, { id: 'no', label: 'No' }],
    resolve: l => l.literate ? 'yes' : 'no',
  },
  {
    id: 'city', title: 'Lives in a city',
    options: [{ id: 'yes', label: 'Yes' }, { id: 'no', label: 'No' }],
    resolve: l => l.city ? 'yes' : 'no',
  },
];

// Jobs by tier and setting; literate lives sometimes draw from the lit pool.
const JOBS = {
  forager: { land: ['a forager', 'a hunter and gatherer'], city: ['a forager'], lit: [] },
  premodern: { land: ['a farmer', 'a herder', 'a fisher', 'a farmhand'], city: ['a potter', 'a weaver', 'a trader', 'a labourer'], lit: ['a scribe', 'a merchant', 'a priest'] },
  industrial: { land: ['a farmer', 'a farm labourer', 'a fisher'], city: ['a mill worker', 'a domestic servant', 'a dock worker', 'a market trader'], lit: ['a clerk', 'a teacher', 'a shopkeeper'] },
  modern: { land: ['a farmer', 'a herder', 'a village trader'], city: ['a factory worker', 'a driver', 'a builder', 'a market trader'], lit: ['a teacher', 'a nurse', 'an office worker', 'an engineer', 'a shop owner'] },
};

// =====================================
// ⬢  Utils
// =====================================
const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));
const mix = (a, b, t) => a + (b - a) * t;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const fmt = n => (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 });
const fmtOdds = o => `${o.toFixed(o < 10 ? 2 : 1)}×`;
const pct = p => p < .01 && p > 0 ? '<1%' : `${Math.round(p * 100)}%`;

function curve(points, x) {
  if (x <= points[0][0]) return points[0][1];
  for (let i = 1; i < points.length; i++) {
    const [x1, y1] = points[i];
    if (x <= x1) {
      const [x0, y0] = points[i - 1];
      return mix(y0, y1, (x - x0) / (x1 - x0));
    }
  }
  return points[points.length - 1][1];
}

function normal(mean, sd) {
  const u = 1 - Math.random(), v = Math.random();
  return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

function pickWeighted(items, weight) {
  const total = items.reduce((s, it) => s + weight(it), 0);
  let r = Math.random() * total;
  for (const it of items) { r -= weight(it); if (r <= 0) return it; }
  return items[items.length - 1];
}

function fmtYear(y) {
  if (y <= 0) return `${1 - y >= 10000 ? fmt(1 - y) : 1 - y} BCE`;
  return y < 1500 ? `${y} CE` : `${y}`;
}

function eraName(y) {
  if (y < -8000) return 'before farming';
  if (y < -3000) return 'early farming';
  if (y < 500) return 'antiquity';
  if (y < 1500) return 'the middle ages';
  if (y < 1800) return 'the early modern era';
  if (y < 1950) return 'the industrial age';
  return 'the modern era';
}

function median(nums) {
  const s = [...nums].sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
}

// =====================================
// ⬢  Model
// =====================================
function drawBirth(mode) {
  const eras = ERAS.filter(e => e.from >= MODES[mode]);
  const era = pickWeighted(eras, e => e.births);
  const year = Math.floor(era.from + (era.to - era.from) * Math.random() ** (1 / era.skew));
  const region = pickWeighted(Object.keys(era.shares), k => era.shares[k]);
  return { year: Math.min(year, CURRENT_YEAR - 1), region };
}

const drawSex = () => Math.random() < .512 ? 'boy' : 'girl';

function regionMod(region, year) {
  if (!region) return { q: 1, shift: 0 };
  const a = clamp((year - 1800) / 150, 0, 1);
  const b = clamp((year - 1950) / 40, 0, 1);
  const [iq, is] = REGION_MODS.industrial[region];
  const [mq, ms] = REGION_MODS.modern[region];
  return { q: mix(mix(1, iq, a), mq, b), shift: mix(mix(0, is, a), ms, b) };
}

function sexShift(sex, year) {
  const w = clamp((year - 1900) / 60, 0, 1);
  if (sex === 'girl') return 1 + 3 * w;
  if (sex === 'boy') return -(1 + w);
  return 0;
}

function adultAge(mean, sd) {
  for (let i = 0; i < 20; i++) {
    const a = normal(mean, sd);
    if (a >= 5 && a <= 105) return Math.round(a);
  }
  return Math.round(clamp(mean, 5, 105));
}

function literacyP(year, region, sex) {
  const era = year < 1500 ? 'ancient' : year < 1950 ? 'early' : 'modern';
  const r = region ? LIT_MULT[era][region] : 1;
  const s = sex ? SEX_LIT[year < 1950 ? 'old' : 'new'][sex] : 1;
  return Math.min(.99, curve(LITERACY, year) * r * s);
}

function cityP(year, region) {
  const r = region ? CITY_MULT[year < 1800 ? 'old' : 'new'][region] : 1;
  return Math.min(.95, curve(URBAN, year) * r);
}

function applyShocks(year, region, sex, age) {
  for (const s of SHOCKS) {
    const base = s.p[region] ?? s.p.all;
    if (!base) continue;
    const [amin, amax] = s.ages ?? [0, 120];
    const lo = Math.max(s.from - year, 0, amin);
    const hi = Math.min(s.to - year, age - 1, amax);
    if (lo > hi) continue;
    const exposure = (hi - lo + 1) / (s.to - s.from + 1);
    const p = base * (s.sex?.[sex] ?? 1) * exposure;
    if (Math.random() < p) return { age: lo + Math.floor(Math.random() * (hi - lo + 1)), shock: s };
  }
  return null;
}

function sampleLife(year, region, sex, withHistory) {
  const mod = regionMod(region, year);
  const q5 = Math.min(.9, curve(Q5, year) * mod.q * SEX_Q5[sex ?? 'any']);
  let age = Math.random() < q5
    ? Math.floor(Math.random() ** 2 * 5)
    : adultAge(curve(ADULT_MEAN, year) + mod.shift + sexShift(sex, year), curve(ADULT_SD, year));

  let shock = null;
  if (withHistory) {
    const hit = applyShocks(year, region, sex, age);
    if (hit) ({ age, shock } = hit);
  }

  return {
    year, region, sex, age, shock,
    deathYear: year + age,
    literate: age >= 10 && Math.random() < literacyP(year, region, sex),
    city: Math.random() < cityP(year, region),
  };
}

// =====================================
// ⬢  Pricing
// =====================================
function simulate(year, region, informed) {
  const out = new Array(SIMS);
  for (let i = 0; i < SIMS; i++) {
    out[i] = informed
      ? sampleLife(year, region, drawSex(), true)
      : sampleLife(year, null, null, false);
  }
  return out;
}

function probsFor(market, samples, isBookie) {
  if (isBookie && market.fixed) return { ...market.fixed };
  const counts = Object.fromEntries(market.options.map(o => [o.id, 0]));
  for (const s of samples) counts[market.resolve(s)]++;
  return Object.fromEntries(Object.entries(counts).map(([k, v]) => [k, v / samples.length]));
}

function deathYearP(samples, guess) {
  let n = 0;
  for (const s of samples) if (Math.abs(s.deathYear - guess) <= DEATH_WINDOW) n++;
  return n / samples.length;
}

const toOdds = p => p < MIN_P ? null : Math.min(MAX_ODDS, Math.max(1.05, (1 - HOUSE_EDGE) / p));

// =====================================
// ⬢  Places and population
// =====================================
// Rough world population (HYDE-style estimates) and the humans-ever total (PRB).
const WORLD_POP = [[-50000, 5e5], [-10000, 4.4e6], [-5000, 1.8e7], [-3000, 4.5e7], [-2000, 7.2e7], [-1000, 1.15e8], [1, 2.3e8], [1000, 2.95e8], [1500, 4.6e8], [1700, 6.0e8], [1800, 9.9e8], [1900, 1.65e9], [1950, 2.54e9], [2000, 6.15e9], [2030, 8.3e9]];
const HUMANS_EVER = 117e9;

// Sub-regions per region: [name, continent, weight]. Weights are static and approximate.
const PLACES = {
  ssa: [['the West African Sahel', 'Africa', 3], ['the Guinea Coast', 'Africa', 3], ['the Congo Basin', 'Africa', 2], ['the Great Lakes', 'Africa', 2], ['the Ethiopian Highlands', 'Africa', 2], ['the Swahili Coast', 'Africa', 1], ['Southern Africa', 'Africa', 1.5]],
  mena: [['the Nile Valley', 'Africa', 3], ['the Maghreb', 'Africa', 2], ['Mesopotamia', 'Asia', 3], ['the Levant', 'Asia', 1.5], ['Anatolia', 'Asia', 2], ['the Iranian Plateau', 'Asia', 2], ['the Arabian Peninsula', 'Asia', 1]],
  eur: [['the Italian Peninsula', 'Europe', 2], ['Iberia', 'Europe', 1.5], ['the North European Plain', 'Europe', 2], ['the British Isles', 'Europe', 1], ['the Balkans', 'Europe', 1.5], ['the Danube Basin', 'Europe', 1.5], ['the East European Plain', 'Europe', 2], ['Scandinavia', 'Europe', .6]],
  sas: [['the Ganges Plain', 'Asia', 4], ['the Indus Valley', 'Asia', 2], ['the Deccan Plateau', 'Asia', 2.5], ['Bengal', 'Asia', 2], ['the Tamil south', 'Asia', 1.5], ['Sri Lanka', 'Asia', .4]],
  eas: [['the Yellow River Valley', 'Asia', 3], ['the Yangtze Valley', 'Asia', 3], ['the Sichuan Basin', 'Asia', 1.2], ['the Pearl River Delta', 'Asia', 1], ['the Korean Peninsula', 'Asia', .6], ['the Japanese islands', 'Asia', .8], ['the Mongolian Steppe', 'Asia', .2]],
  sea: [['Java', 'Asia', 2], ['the Mekong Basin', 'Asia', 1.5], ['the Irrawaddy Valley', 'Asia', 1], ['the Philippine islands', 'Asia', 1], ['the Malay Peninsula', 'Asia', .6], ['New Guinea', 'Oceania', .4], ['Australia', 'Oceania', .2]],
  ame: [['the Valley of Mexico', 'North America', 2], ['the Maya lowlands', 'North America', 1], ['the Mississippi Valley', 'North America', .8], ['the Caribbean', 'North America', .5], ['the Andes', 'South America', 2], ['the Amazon Basin', 'South America', 1], ['the Río de la Plata', 'South America', .6]],
};

function pickPlace(region) {
  const [name, continent, weight] = pickWeighted(PLACES[region], p => p[2]);
  const total = PLACES[region].reduce((s, p) => s + p[2], 0);
  return { name, continent, share: weight / total };
}

function regionShare(year, region) {
  const era = ERAS.find(e => year >= e.from && year < e.to) ?? ERAS[ERAS.length - 1];
  return era.shares[region] / Object.values(era.shares).reduce((s, v) => s + v, 0);
}

function fmtPeople(n) {
  if (n >= 1e9) return `${(n / 1e9).toFixed(1)} billion`;
  if (n >= 1e6) return `${Math.round(n / 1e6)} million`;
  if (n >= 1e3) return `${Math.round(n / 1e3)} thousand`;
  return `${Math.round(n)}`;
}

function periodName(y) {
  if (y < -10000) return 'Old Stone Age';
  if (y < -3300) return 'New Stone Age';
  if (y < -1200) return 'Bronze Age';
  if (y < -500) return 'Iron Age';
  if (y < 500) return 'Classical era';
  if (y < 1500) return 'Middle Ages';
  if (y < 1800) return 'Early modern era';
  if (y < 1950) return 'Industrial age';
  return 'Modern era';
}

function placeContext({ year, region, place }) {
  const world = curve(WORLD_POP, year);
  const local = world * regionShare(year, region) * place.share;
  return {
    where: `${place.name}, ${place.continent}`,
    local: `About ${fmtPeople(local)} people lived there then.`,
    when: `${fmt(CURRENT_YEAR - year)} years ago, ${periodName(year)}. About ${fmtPeople(world)} people were alive, ${(world / HUMANS_EVER * 100).toFixed(3)}% of all humans ever.`,
  };
}

// Plain-language payout labels instead of decimal odds.
function chanceTag(p) {
  if (p >= .6) return 'Likely';
  if (p >= .3) return 'Toss-up';
  if (p >= .1) return 'Unlikely';
  return 'Long shot';
}

// =====================================
// ⬢  Storage
// =====================================
const SAVED_KEYS = ['bankroll', 'rounds', 'bestRound', 'streak', 'era', 'chip', 'skill'];

function loadSave() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(Object.fromEntries(SAVED_KEYS.map(k => [k, state[k]]))));
  } catch { /* storage unavailable: play continues in memory */ }
}

// =====================================
// ⬢  State
// =====================================
const DEFAULTS = { bankroll: START_BANKROLL, rounds: 0, bestRound: 0, streak: 0, era: 'all', chip: 10, skill: 0 };

const state = {
  ...DEFAULTS,
  phase: 'idle',        // idle | rolling | betting | revealed
  draw: null,           // { year, region, place }
  bookie: [],           // samples priced on year only
  truth: [],            // samples with region, sex, history
  odds: {},             // marketId -> optionId -> { p, odds }
  bets: {},             // marketId -> { option, stake } | dy -> { guess, stake }
  step: 0,              // market pager index
  revealPage: 0,        // 0 = reel, 1 = life, 2 = bets
  lastRound: null,      // { life, results, net, skill, story }
  shown: null,          // stats snapshot shown while the reel plays
  reel: { token: 0, done: true },
};

const $ = id => document.getElementById(id);
const els = Object.fromEntries(
  ['bankroll', 'walletUnit', 'resetBtn', 'status', 'stage', 'eras', 'drawHero', 'year', 'where', 'timeline',
   'hint', 'drawBtn', 'board', 'reveal', 'staked', 'stakeUnit', 'chips', 'slipList', 'potential', 'betCount',
   'lockBtn', 'leaders'].map(id => [id, $(id)])
);

// Derived
const STEPS = [...MARKETS.map(m => m.id), 'dy'];
const totalStaked = () => Object.values(state.bets).reduce((s, b) => s + b.stake, 0);
const canAfford = add => totalStaked() + add <= state.bankroll;
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const revealVisible = () => state.phase === 'revealed' && !!state.lastRound;
const view = () => (state.reel.done ? state : { ...state, ...state.shown });

function oddsFor(id) {
  const bet = state.bets[id];
  if (!bet) return null;
  if (id === 'dy') return toOdds(deathYearP(state.bookie, bet.guess));
  return bet.option ? state.odds[id][bet.option].odds : null;
}

function marketLabel(id) {
  if (id === 'dy') return { market: 'Year of death', pick: `${fmtYear(state.bets.dy.guess)} ± ${DEATH_WINDOW}` };
  const m = MARKETS.find(x => x.id === id);
  return { market: m.title, pick: m.options.find(o => o.id === state.bets[id].option).label };
}

function timelineX(year) {
  const tmin = Math.log10(10);
  const tmax = Math.log10(CURRENT_YEAR + 50000 + 10);
  const t = (Math.log10(CURRENT_YEAR - year + 10) - tmin) / (tmax - tmin);
  return 10 + 580 * (1 - clamp(t, 0, 1));
}

function renderTimeline() {
  const ticks = [[-50000, '50k BCE'], [-8000, '8k BCE'], [1, '1 CE'], [1500, '1500'], [1900, '1900'], [CURRENT_YEAR, 'Now']];
  const tickSvg = ticks.map(([y, label], i) => {
    const x = timelineX(y);
    const anchor = i === 0 ? 'start' : i === ticks.length - 1 ? 'end' : 'middle';
    return `<line class="tick" x1="${x}" x2="${x}" y1="14" y2="22"/><text x="${x}" y="38" text-anchor="${anchor}">${label}</text>`;
  }).join('');
  const marker = state.draw
    ? `<g class="marker" style="transform:translateX(${timelineX(state.draw.year)}px)"><path d="M0 18 L-6 8 L6 8 Z"/></g>`
    : '';
  els.timeline.innerHTML = `<line class="axis" x1="10" x2="590" y1="18" y2="18"/>${tickSvg}${marker}`;
}

function renderStage() {
  const { phase, draw } = state;
  const fresh = phase === 'idle';

  if (phase !== 'rolling') {
    els.year.textContent = draw ? fmtYear(draw.year) : '?';
    if (draw) {
      const ctx = placeContext(draw);
      els.where.innerHTML = `Born in <b>${ctx.where}</b><span class="where-sub">${ctx.local}</span><span class="where-sub">${ctx.when}</span>`;
    } else {
      els.where.textContent = 'Nobody drawn yet.';
    }
  }

  els.hint.hidden = !fresh;
  els.hint.textContent = BASE_HINT;
  els.drawHero.classList.toggle('compact', !fresh);
  els.stage.classList.toggle('revealing', revealVisible());
  renderTimeline();

  const broke = state.bankroll < MIN_STAKE;
  els.drawBtn.hidden = !fresh;
  els.drawBtn.textContent = broke ? `Start over with ${fmt(START_BANKROLL)}` : 'Draw a human';
}

// =====================================
// ⬢  Render: lifespan graphics
// =====================================
const ageX = (a, w = 600) => 24 + (w - 48) * clamp(a, 0, 100) / 100;

function axisSvg(inner, height = 64, w = 600) {
  const ticks = Array.from({ length: 11 }, (_, i) => {
    const x = ageX(i * 10, w);
    return `<line class="tick" x1="${x}" x2="${x}" y1="${height - 26}" y2="${height - 20}"/><text x="${x}" y="${height - 6}" text-anchor="middle">${i * 10}</text>`;
  }).join('');
  return `<svg class="lifespan" viewBox="0 0 ${w} ${height}" role="img" aria-label="Lifespan from 0 to 100">
    <line class="axis" x1="${ageX(0, w)}" x2="${ageX(100, w)}" y1="${height - 30}" y2="${height - 30}"/>${ticks}${inner}</svg>`;
}

function deathMark(age, height, w = 600) {
  const x = ageX(age, w), y = height - 30;
  return `<g id="reelX" data-age="${age}"><path class="x" d="M${x - 6} ${y - 18} L${x + 6} ${y - 6} M${x + 6} ${y - 18} L${x - 6} ${y - 6}"/>
    <text class="x-age" x="${x}" y="${y - 24}" text-anchor="middle">${age}</text></g>`;
}

function reelAxis(life) {
  const y = 34;
  return axisSvg(`<line class="run" id="reelRun" x1="${ageX(0)}" x2="${ageX(0)}" y1="${y}" y2="${y}"/>
    <g id="reelXWrap" hidden>${deathMark(life.age, 64)}</g>`);
}

function histogram(samples) {
  const bins = new Array(21).fill(0);
  for (const s of samples) bins[Math.min(20, Math.floor(s.age / 5))]++;
  return bins.map(b => b / samples.length);
}

// Real spread as bars, bookie's assumption as a dashed line. Bars taller than
// twice the tallest adult bin are capped and labelled, so infant deaths do not
// flatten the rest of the chart.
function lifespanChart(life) {
  const w = 900, h = 120, base = h - 30, top = 18;
  const real = histogram(state.truth), book = histogram(state.bookie);
  const cap = Math.max(...real.slice(1), ...book.slice(1)) * 2;
  const barY = v => base - (base - top) * Math.min(v, cap) / cap;
  const bw = ageX(5, w) - ageX(0, w) - 2;
  const bars = real.map((v, i) => {
    const x = ageX(i * 5, w) + 1;
    const label = v > cap ? `<text x="${x + bw / 2}" y="${top - 6}" text-anchor="middle">${pct(v)}</text>` : '';
    return `<rect class="real" x="${x}" y="${barY(v)}" width="${bw}" height="${base - barY(v)}"/>${label}`;
  }).join('');
  const line = book.map((v, i) => `${ageX(i * 5 + 2.5, w)},${barY(v)}`).join(' ');
  return axisSvg(`${bars}<polyline class="bookie" points="${line}"/>${deathMark(life.age, h, w)}`, h, w);
}

// =====================================
// ⬢  Render: reveal pages
// =====================================
function tellStory(life, childDeathShare) {
  const she = life.sex === 'girl' ? 'She' : 'He';
  const alive = life.deathYear >= CURRENT_YEAR;
  const place = life.year < -8000 ? `a foraging band in ${life.place.name}` : life.place.name;
  const parts = [`${life.sex === 'girl' ? 'A girl' : 'A boy'} is born in ${place}, ${fmtYear(life.year)}.`];
  const grownUp = alive ? CURRENT_YEAR - life.year >= 16 : life.age >= 16;

  if (grownUp) {
    const tier = life.year < -8000 ? 'forager' : life.year < 1800 ? 'premodern' : life.year < 1950 ? 'industrial' : 'modern';
    const jobs = JOBS[tier];
    const pool = life.literate && jobs.lit.length && Math.random() < .6 ? jobs.lit : jobs[life.city ? 'city' : 'land'];
    parts.push(`${she} works as ${pick(pool)}, ${life.literate ? 'can read' : 'never learns to read'}, and ${life.city ? 'spends years in a city' : 'lives on the land'}.`);
  }

  if (alive) parts.push(`${she} is alive today, with a projected lifespan of ${life.age} years.`);
  else if (life.shock) parts.push(`${she} dies at ${life.age} in ${fmtYear(life.deathYear)}, a victim of the ${life.shock.phrase}.`);
  else if (life.age === 0) parts.push(`${she} dies before turning one.`);
  else parts.push(`${she} dies at ${life.age} in ${fmtYear(life.deathYear)}.`);

  if (life.age < 5 && !alive) parts.push(`About ${Math.round(childDeathShare * 10)} in 10 children born there and then never reached five.`);
  return parts.join(' ');
}

// =====================================
// ⬢  Reveal reel (anticipation)
// =====================================
// Plays the life out: sex flips, age runs along the axis, each bet settles the
// moment the outcome is certain, then reading and city resolve. A token cancels
// a running reel when the player skips or leaves.
const alive = token => token === state.reel.token;
const wait = (ms, token) => new Promise(r => setTimeout(r, reducedMotion() ? 0 : ms)).then(() => alive(token));
const frame = () => new Promise(r => requestAnimationFrame(r));

function verdictEl(id) { return els.reveal.querySelector(`[data-verdict="${id}"]`); }

function markLive(id, text = 'Live') {
  const el = verdictEl(id);
  if (el && !el.dataset.state?.match(/won|lost/)) { el.textContent = text; el.dataset.state = 'live'; }
}

function settle(r) {
  const el = verdictEl(r.id);
  if (!el || /won|lost/.test(el.dataset.state ?? '')) return;
  el.dataset.state = r.won ? 'won' : 'lost';
  el.textContent = r.won ? `Won +${fmt(r.net)}` : `Lost ${fmt(-r.net)}`;
}

function paintLife(life, age) {
  const a = Math.floor(age);
  $('reelAge').textContent = a;
  $('reelYear').textContent = fmtYear(life.year + a);
  $('reelRun').setAttribute('x2', ageX(age));
}

async function runLifespan(life, token, byId) {
  const duration = reducedMotion() ? 0 : clamp(600 + life.age * 26, 900, REEL_MAX_MS);
  const age = byId.age, dy = byId.dy;
  const [lo, hi] = age ? AGE_RANGES[age.pickId] : [0, 0];
  const guessAge = dy ? dy.guess - life.year : 0;
  const start = performance.now();
  let t = 0;

  while (t < 1) {
    await frame();
    if (!alive(token)) return false;
    t = duration ? Math.min(1, (performance.now() - start) / duration) : 1;
    const a = life.age * (1 - (1 - t) ** 2);
    paintLife(life, a);
    if (age && a >= lo) markLive('age');
    if (age && a >= hi) settle(age);                         // outlived the picked bracket
    if (dy && a >= guessAge - DEATH_WINDOW) markLive('dy', 'In window');
    if (dy && a > guessAge + DEATH_WINDOW) settle(dy);       // outlived the picked window
  }

  paintLife(life, life.age);
  $('reelXWrap').hidden = false;
  if (age) settle(age);
  if (dy) settle(dy);
  return true;
}

async function playReel() {
  const token = ++state.reel.token;
  state.reel.done = false;
  const { life, results } = state.lastRound;
  const byId = Object.fromEntries(results.map(r => [r.id, r]));

  // Sex: quick flip
  if (byId.sex) markLive('sex');
  const sexEl = $('reelSex');
  for (let i = 0; i < 8; i++) {
    if (!(await wait(90, token))) return;
    sexEl.textContent = i % 2 ? 'Girl' : 'Boy';
  }
  sexEl.textContent = life.sex === 'girl' ? 'Girl' : 'Boy';
  if (byId.sex) settle(byId.sex);
  if (!(await wait(350, token))) return;

  // Lifespan run
  if (!(await runLifespan(life, token, byId))) return;

  // Reading, then city
  for (const id of ['read', 'city']) {
    if (!byId[id]) continue;
    markLive(id);
    if (!(await wait(600, token))) return;
    settle(byId[id]);
  }
  if (!(await wait(300, token))) return;
  finishReel();
}

function paintReelFinal() {
  const { life, results } = state.lastRound;
  $('reelSex').textContent = life.sex === 'girl' ? 'Girl' : 'Boy';
  paintLife(life, life.age);
  $('reelXWrap').hidden = false;
  results.forEach(settle);
  const net = state.lastRound.net;
  const netEl = $('reelNet');
  netEl.hidden = false;
  netEl.className = `net ${net >= 0 ? 'pos' : 'neg'}`;
  netEl.textContent = results.length ? `${net >= 0 ? 'Up' : 'Down'} ${fmt(Math.abs(net))} ${CURRENCY}` : '';
  const living = life.deathYear >= CURRENT_YEAR;
  els.reveal.querySelector('.fate').textContent = living ? 'Still living' : `Died at ${life.age}`;
}

function finishReel() {
  state.reel.token++;
  state.reel.done = true;
  state.shown = null;
  if (revealPages()[state.revealPage] === 'reel') paintReelFinal();
  renderRevealPager();
  renderHeader();
  renderStatus();
  renderLeaders();
}

// =====================================
// ⬢  Actions: rounds
// =====================================
function drawHuman() {
  if (state.bankroll < MIN_STAKE) return resetGame();
  const { year, region } = drawBirth(state.era);
  const draw = { year, region, place: pickPlace(region) };
  state.draw = draw;
  state.bookie = simulate(year, region, false);
  state.truth = simulate(year, region, true);
  state.odds = Object.fromEntries(MARKETS.map(m => {
    const probs = probsFor(m, state.bookie, true);
    return [m.id, Object.fromEntries(Object.entries(probs).map(([k, p]) => [k, { p, odds: toOdds(p) }]))];
  }));
  state.bets = Object.fromEntries(MARKETS.map(m => [m.id, { option: null, stake: 0 }]));
  state.bets.dy = { guess: median(state.bookie.map(s => s.deathYear)), stake: 0 };
  state.step = 0;
  rollYear();
}

function rollYear() {
  const finish = () => {
    els.year.classList.remove('rolling');
    state.phase = 'betting';
    renderAll();
    els.board.querySelector('.opt')?.focus({ preventScroll: true });
  };
  state.phase = 'rolling';
  renderAll();
  if (reducedMotion()) return finish();
  els.year.classList.add('rolling');
  els.where.textContent = 'Drawing…';
  const start = performance.now();
  const tick = now => {
    if (now - start > 750) return finish();
    els.year.textContent = fmtYear(Math.floor(Math.random() * (CURRENT_YEAR + 12000)) - 12000);
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function skipHuman() {
  state.bankroll -= SKIP_FEE;
  persist();
  drawHuman();
}

function resolveBets(life) {
  const results = [];
  for (const m of MARKETS) {
    const bet = state.bets[m.id];
    if (!bet.stake || !bet.option) continue;
    const outcome = m.resolve(life);
    const { p, odds } = state.odds[m.id][bet.option];
    const trueP = probsFor(m, state.truth, false)[bet.option];
    const label = id => m.options.find(o => o.id === id).label;
    const won = outcome === bet.option;
    results.push({
      id: m.id, pickId: bet.option, won,
      market: m.title, pick: label(bet.option), outcome: label(outcome),
      bookieP: p, trueP,
      net: won ? bet.stake * (odds - 1) : -bet.stake,
      skill: bet.stake * (trueP * odds - 1),
    });
  }

  const dy = state.bets.dy;
  if (dy.stake) {
    const odds = oddsFor('dy');
    const trueP = deathYearP(state.truth, dy.guess);
    const won = Math.abs(life.deathYear - dy.guess) <= DEATH_WINDOW;
    results.push({
      id: 'dy', guess: dy.guess, won,
      market: 'Year of death', pick: `${fmtYear(dy.guess)} ± ${DEATH_WINDOW}`, outcome: fmtYear(life.deathYear),
      bookieP: deathYearP(state.bookie, dy.guess), trueP,
      net: won ? dy.stake * (odds - 1) : -dy.stake,
      skill: dy.stake * (trueP * odds - 1),
    });
  }
  return results;
}

function placeBets() {
  if (state.phase !== 'betting') return;
  const { year, region, place } = state.draw;
  const life = { ...sampleLife(year, region, drawSex(), true), place };
  const results = resolveBets(life);
  const net = Math.round(results.reduce((s, r) => s + r.net, 0) * 100) / 100;
  const skill = results.reduce((s, r) => s + r.skill, 0);

  // Freeze what the player sees until the reel finishes
  state.shown = { bankroll: state.bankroll, streak: state.streak, bestRound: state.bestRound, skill: state.skill };

  // Commit the round
  state.bankroll = Math.max(0, Math.round((state.bankroll + net) * 100) / 100);
  state.rounds += 1;
  state.bestRound = Math.max(state.bestRound, net);
  state.skill += skill;
  if (net > 0) state.streak += 1;
  if (net < 0) state.streak = 0;
  state.bets = {};
  state.lastRound = { life, results, net, skill, story: null };
  state.revealPage = 0;
  state.reel.done = false;
  state.phase = 'revealed';

  persist();
  renderAll();
  renderReveal();
  playReel();
}

function resetGame() {
  state.reel.token++;
  Object.assign(state, DEFAULTS, {
    era: state.era, chip: state.chip, phase: 'idle', draw: null, bets: {},
    lastRound: null, shown: null, reel: { token: state.reel.token, done: true },
  });
  persist();
  renderAll();
}

// =====================================
// ⬢  Actions: bet slip and paging
// =====================================
function toggleOption(marketId, optId) {
  const bet = state.bets[marketId];
  if (bet.option === optId) {
    Object.assign(bet, { option: null, stake: 0 });
  } else {
    if (!bet.stake && !canAfford(state.chip)) return;
    bet.option = optId;
    bet.stake ||= state.chip;
  }
  renderBoard(`[data-market="${marketId}"][data-opt="${optId}"]`);
  renderSlip();
}

function toggleDeath() {
  const bet = state.bets.dy;
  if (bet.stake) bet.stake = 0;
  else if (canAfford(state.chip) && oddsFor('dy') !== null) bet.stake = state.chip;
  updateDeathMarket();
  renderSlip();
}

function moveDeathGuess(value) {
  const bet = state.bets.dy;
  bet.guess = Number(value);
  if (oddsFor('dy') === null) bet.stake = 0;
  updateDeathMarket();
  renderSlip();
}

function changeStake(id, dir) {
  const bet = state.bets[id];
  if (dir > 0 && !canAfford(state.chip)) return;
  const next = Math.round((bet.stake + dir * state.chip) * 100) / 100;
  const removed = next <= 0;
  bet.stake = removed ? 0 : next;
  if (removed && id !== 'dy') bet.option = null;
  if (id === 'dy') updateDeathMarket();
  else if (removed) renderBoard();
  renderSlip(removed ? null : `[data-stake="${id}"][data-dir="${dir}"]`);
}

function goStep(dir) {
  state.step = clamp(state.step + dir, 0, STEPS.length - 1);
  renderBoard('.opt:not([disabled]), #dyToggle');
}

function setChip(size) {
  state.chip = size;
  persist();
  if (state.phase === 'betting') renderBoard();
  renderSlip(`[data-chip="${size}"]`);
}

function turnRevealPage(action) {
  if (action === 'skip') return finishReel();
  const max = revealPages().length - 1;
  state.revealPage = clamp(state.revealPage + (action === 'forward' ? 1 : -1), 0, max);
  renderReveal();
}

// =====================================
// ⬢  Events
// =====================================
els.drawBtn.addEventListener('click', drawHuman);
els.lockBtn.addEventListener('click', placeBets);
els.resetBtn.addEventListener('click', () => {
  if (state.rounds === 0 || confirm('Start over with a fresh bankroll and skill score?')) resetGame();
  els.resetBtn.closest('details').open = false;
});

els.eras.addEventListener('click', e => {
  const btn = e.target.closest('[data-era]');
  if (!btn || btn.disabled) return;
  state.era = btn.dataset.era;
  persist();
  renderHeader();
});

els.board.addEventListener('click', e => {
  const pager = e.target.closest('[data-pager]')?.dataset.pager;
  if (pager) return ({ next: () => goStep(1), back: () => goStep(-1), skip: skipHuman, place: placeBets })[pager]();
  if (e.target.closest('#dyToggle')) return toggleDeath();
  const opt = e.target.closest('.opt[data-market]');
  if (opt) toggleOption(opt.dataset.market, opt.dataset.opt);
});

els.board.addEventListener('input', e => {
  if (e.target.id === 'dySlider') moveDeathGuess(e.target.value);
});

els.chips.addEventListener('click', e => {
  const btn = e.target.closest('[data-chip]');
  if (btn) setChip(Number(btn.dataset.chip));
});

els.slipList.addEventListener('click', e => {
  const btn = e.target.closest('[data-stake]');
  if (btn) changeStake(btn.dataset.stake, Number(btn.dataset.dir));
});

els.reveal.addEventListener('click', e => {
  const page = e.target.closest('[data-reveal]');
  if (page && !page.disabled) return turnRevealPage(page.dataset.reveal);
  const action = e.target.closest('[data-action]')?.dataset.action;
  if (action === 'next') drawHuman();
  if (action === 'reset') resetGame();
});

// =====================================
// ⬢  Init
// =====================================
(function init() {
  const saved = loadSave() ?? {};
  for (const k of SAVED_KEYS) {
    if (typeof saved[k] === typeof DEFAULTS[k]) state[k] = saved[k];
  }
  if (MODES[state.era] === undefined) state.era = DEFAULTS.era;
  if (!CHIP_SIZES.includes(state.chip)) state.chip = DEFAULTS.chip;
  renderAll();
})();
</script>
</body>
